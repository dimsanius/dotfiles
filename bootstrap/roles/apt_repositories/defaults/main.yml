---
# defaults file for roles/apt_repositories
apt_repositories_repos:
  - name: brave-browser
    uris: https://brave-browser-apt-release.s3.brave.com/
    suites: stable
    components: main
    signed_by: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    package: brave-browser

  - name: vscode
    uris: https://packages.microsoft.com/repos/vscode
    suites: stable
    components: main
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
    package: code

  - name: tailscale
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.distribution_release }}.noarmor.gpg"
    package: tailscale

  - name: sublime-text
    uris: https://download.sublimetext.com/
    suites: apt/stable/
    signed_by: https://download.sublimetext.com/sublimehq-pub.gpg
    package: sublime-text

  - name: fastfetch
    uris: https://ppa.launchpadcontent.net/zhangsongcui3371/fastfetch/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "https://ppa.launchpadcontent.net/zhangsongcui3371/fastfetch/ubuntu/dists/{{ ansible_facts.distribution_release }}/Release.gpg"
    package: fastfetch

  - name: google-chrome
    uris: https://dl.google.com/linux/chrome-stable/deb/
    suites: stable
    components: main
    signed_by: https://dl.google.com/linux/linux_signing_key.pub
    package: google-chrome-stable

  - name: kicad
    uris: https://ppa.launchpadcontent.net/kicad/kicad-10.0-releases/ubuntu/
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "https://ppa.launchpadcontent.net/kicad/kicad-10.0-releases/ubuntu/dists/{{ ansible_facts.distribution_release }}/Release.gpg"
    package: kicad

  - name: virtualbox
    uris: https://download.virtualbox.org/virtualbox/debian
    suites: "{{ ansible_facts.distribution_release }}"
    components: contrib
    signed_by: https://www.virtualbox.org/download/oracle_vbox_2016.asc
    package: virtualbox-7.2

  - name: terminator
    uris: https://ppa.launchpadcontent.net/mattrose/terminator/ubuntu/
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "https://ppa.launchpadcontent.net/mattrose/terminator/ubuntu/dists/{{ ansible_facts.distribution_release }}/Release.gpg"
    package: terminator
